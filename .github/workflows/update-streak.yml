name: Update streak card

on:
  schedule:
    - cron: "15 0 * * *" # once every 24 hours (00:15 UTC). Edit to taste.
  workflow_dispatch: # manual "Run workflow" button
  push:
    paths:
      - "scripts/generate-streak.mjs"
      - "templates/profile-streak.template.svg"
      - ".github/workflows/update-streak.yml"

permissions:
  contents: write

concurrency:
  group: update-streak
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate profile-streak.svg from real contribution data
        env:
          # Optional PAT (scope: read:user) so private contributions are counted too.
          # Falls back to the built-in token, which only sees public contributions.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-streak.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain profile-streak.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add profile-streak.svg
            git commit -m "chore: update streak card"
            git push
          else
            echo "No changes."
          fi
