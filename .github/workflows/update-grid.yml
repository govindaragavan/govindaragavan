name: Update contribution grid

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: # manual "Run workflow" button
  push:
    paths:
      - "grid.config.json"
      - "templates/**"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: update-grid
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVGs from real contribution data
        env:
          # Optional PAT (scope: read:user) lets private contributions be counted.
          # Falls back to the built-in token, which sees public contributions only.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain dist)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist
            git commit -m "chore: update contribution grid"
            git push
          else
            echo "No changes."
          fi
